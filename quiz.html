<!DOCTYPE html>
<html lang="en">
  <head>
  <meta charset="UTF-8" />
  <title>Quiz - Genre Spin Quiz</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <header>
    <h1 id="quizGenreTitle">Quiz</h1>
    <div class="top-stats">
      <div id="progress">Question <span id="qNumber">1</span></div>
      <div id="balance">Balance: $<span id="balanceValue">1000</span></div>
    </div>
    <div class="genre-hero"><img id="quizGenreImage" alt="Genre image"></div>
  </header>
  <main class="quiz-container">
    <div id="questionText" class="question"></div>
    <div id="answers" class="answers"></div>
    <button id="nextBtn" class="next hidden">Next</button>
  </main>
  <script src="assets/questions.js"></script>
  <script src="assets/genre-assets.js"></script>
  <script src="assets/quiz.js"></script>
</body>
</html>
